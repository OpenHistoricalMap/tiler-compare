<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>OpenHistoricalMap - Comparador de propiedades</title>
    <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no" />

    <link href="https://unpkg.com/maplibre-gl@2.4.0/dist/maplibre-gl.css" rel="stylesheet" />
    <script src="https://unpkg.com/maplibre-gl@2.4.0/dist/maplibre-gl.js"></script>

    <style>
      html, body {
        margin: 0; padding: 0; height: 100%; overflow: hidden;
        font-family: sans-serif;
      }
      #map { position: absolute; top: 0; bottom: 0; width: 100%; }

      #layer-toggle {
        position: absolute;
        top: 10px; left: 10px;
        background: #333;
        color: white;
        padding: 6px 10px;
        border-radius: 4px;
        cursor: pointer;
        z-index: 1100;
        font-size: 13px;
      }

      #env-indicator {
        position: absolute;
        top: 10px; right: 10px;
        background: rgba(0,0,0,0.7);
        color: white;
        padding: 6px 10px;
        border-radius: 4px;
        z-index: 1100;
        font-size: 12px;
        font-weight: bold;
      }

      #layer-panel {
        position: absolute;
        top: 45px; left: 10px;
        background: rgba(0,0,0,0.85);
        color: white;
        max-height: 70%;
        overflow-y: auto;
        padding: 10px;
        border-radius: 6px;
        z-index: 1000;
        font-size: 13px;
        display: none;
        min-width: 220px;
      }

      .map-group {
        margin-bottom: 8px;
        border-bottom: 1px solid rgba(255,255,255,0.2);
        padding-bottom: 6px;
      }
      .map-group:last-child { border-bottom: none; }

      .map-group-header {
        display: flex;
        align-items: center;
        gap: 6px;
        cursor: pointer;
        padding: 4px 0;
        font-weight: bold;
        font-size: 13px;
      }
      .map-group-header:hover { color: #8cf; }

      .map-group-layers {
        margin-left: 18px;
        display: none;
      }
      .map-group-layers.expanded { display: block; }

      .map-group-layers label {
        display: block;
        padding: 2px 0;
        cursor: pointer;
        font-size: 12px;
      }
      .map-group-layers label:hover { color: #8cf; }

      .color-dot {
        display: inline-block;
        width: 10px; height: 10px;
        border-radius: 50%;
        margin-right: 4px;
        vertical-align: middle;
      }

      #attribute-table {
        position: absolute; bottom: 0; left: 0; right: 0;
        max-height: 70%; background: rgba(255,255,255,0.95);
        overflow-y: auto; border-top: 2px solid #444;
        font-size: 13px; padding: 8px;
        display: flex; flex-wrap: wrap; gap: 10px;
      }
      .feature-card {
        background: white; border: 1px solid #ccc; border-radius: 6px;
        padding: 6px; font-size: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        max-height: 220px; overflow-y: auto; flex: 1 1 250px;
      }
      .feature-card h4 {
        margin: 3px 0; font-size: 13px;
        border-bottom: 1px solid #ddd; padding-bottom: 2px;
      }
      .feature-card table { width: 100%; border-collapse: collapse; }
      .feature-card td {
        border-bottom: 1px solid #eee;
        padding: 2px 4px; word-break: break-word;
      }
      .feature-card tr:last-child td { border-bottom: none; }
      .feature-card a { color: #1a73e8; text-decoration: none; }
      .feature-card a:hover { text-decoration: underline; }
      .feature-card h4 a { color: #1a73e8; }
      .highlight-start { background: #c6f6c6; font-weight: bold; }
      .highlight-end { background: #fff6b3; font-weight: bold; }

      #loading-indicator {
        position: absolute;
        top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        background: rgba(0,0,0,0.8);
        color: white;
        padding: 16px 24px;
        border-radius: 8px;
        z-index: 2000;
        font-size: 14px;
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <div id="layer-toggle">&#9776; Capas</div>
    <div id="env-indicator"></div>
    <div id="layer-panel"><strong>Fuentes (capabilities)</strong><br/><div id="sources-list"><em>Cargando fuentes...</em></div></div>
    <div id="attribute-table"><em>Haz click en un objeto para ver sus atributos...</em></div>
    <div id="loading-indicator">Cargando fuentes...</div>

    <script>
      const urlParams = new URLSearchParams(window.location.search);
      const env = urlParams.get('env') || 'production';
      const featureId = urlParams.get('id');

      const capabilitiesUrl = env === 'production'
        ? 'https://vtiles.openhistoricalmap.org/capabilities'
        : 'https://vtiles.ohmstaging.org/capabilities';

      // Fixed colors per source__layer (based on capabilities)
      const fixedLayerColors = {
        // ohm - land
        'ohm__land_ohm_lines': '#2e8b57',
        'ohm__land_ohm_centroids': '#3cb371',
        'ohm__land_ohm_maritime': '#20b2aa',
        // ohm - places
        'ohm__place_areas': '#ff8c00',
        'ohm__place_points_centroids': '#ffa500',
        // ohm - water
        'ohm__water_areas': '#4363d8',
        'ohm__water_areas_centroids': '#1e90ff',
        'ohm__water_lines': '#00bfff',
        // ohm - transport
        'ohm__transport_areas': '#e6194b',
        'ohm__transport_lines': '#dc143c',
        'ohm__route_lines': '#911eb4',
        'ohm__transport_points_centroids': '#ff6347',
        // ohm - amenity
        'ohm__amenity_areas': '#f032e6',
        'ohm__amenity_points_centroids': '#ff69b4',
        // ohm - buildings
        'ohm__buildings': '#9a6324',
        'ohm__buildings_points_centroids': '#d2691e',
        // ohm - landuse
        'ohm__landuse_areas': '#bfef45',
        'ohm__landuse_points_centroids': '#7fff00',
        'ohm__landuse_lines': '#808000',
        // ohm - other
        'ohm__other_areas': '#a9a9a9',
        'ohm__other_points_centroids': '#c0c0c0',
        'ohm__other_lines': '#778899',
        // ohm - communication
        'ohm__communication': '#42d4f4',
        // ohm_admin
        'ohm_admin__boundaries': '#800000',
        // ohm_non_admin
        'ohm_non_admin__boundaries_areas': '#b22222',
        'ohm_non_admin__boundaries_centroids': '#cd5c5c',
        // ne
        'ne__water_areas': '#000075',
        // osm_land
        'osm_land__land': '#aaffc3'
      };
      // Fallback palette for layers not in the fixed map
      const fallbackColors = [
        '#e6194b', '#3cb44b', '#4363d8', '#f58231', '#911eb4',
        '#42d4f4', '#f032e6', '#bfef45', '#fabebe', '#469990'
      ];
      let fallbackColorIndex = 0;

      // Track added MapLibre layer IDs per source layer
      const addedLayerIds = {};

      function getCenterZoomFromHash() {
        const hash = window.location.hash;
        let zoom = 10, lat = 49.9521, lng = 8.524;
        const match = hash.match(/#(\d+\.?\d*)\/([-\d.]+)\/([-\d.]+)/);
        if (match) {
          zoom = parseFloat(match[1]);
          lat = parseFloat(match[2]);
          lng = parseFloat(match[3]);
        }
        return { center: [lng, lat], zoom };
      }

      function extractDate(feature, keyDec, keyString) {
        if (feature.properties[keyDec] !== undefined) {
          return parseFloat(feature.properties[keyDec]);
        }
        if (feature.properties[keyString] !== undefined) {
          const val = feature.properties[keyString];
          const year = parseInt(val.toString().substring(0, 4));
          return isNaN(year) ? Infinity : year;
        }
        return Infinity;
      }

      function updateUrlWithFeatureId(feature) {
        let id = null;
        if (feature.id !== undefined) {
          id = feature.id.toString();
        } else if (feature.properties && feature.properties.id !== undefined) {
          id = feature.properties.id.toString();
        } else if (feature.properties && feature.properties.osm_id !== undefined) {
          id = feature.properties.osm_id.toString();
        }
        if (!id) return;
        const url = new URL(window.location);
        url.searchParams.set('id', id);
        if (env) url.searchParams.set('env', env);
        window.history.replaceState({}, '', url);
      }

      function getOsmType(feature) {
        if (!feature.geometry) return 'way';
        switch (feature.geometry.type) {
          case 'Point':
          case 'MultiPoint':
            return 'node';
          case 'LineString':
          case 'MultiLineString':
            return 'way';
          default:
            return 'way';
        }
      }

      function formatPropertyValue(key, value, feature) {
        if (value === null || value === undefined) return '';
        const strVal = String(value);
        const ohmBase = 'https://www.openhistoricalmap.org';
        if (key === 'relation' && strVal) {
          return `<a href="${ohmBase}/relation/${strVal}" target="_blank">${strVal}</a>`;
        }
        if ((key === '_id' || key === 'osm_id') && strVal) {
          const osmType = getOsmType(feature);
          return `<a href="${ohmBase}/${osmType}/${strVal}" target="_blank">${strVal}</a>`;
        }
        return strVal;
      }

      function displayFeatures(features) {
        const tableDiv = document.getElementById("attribute-table");

        if (!features.length) {
          tableDiv.innerHTML = "<em>No se encontraron objetos.</em>";
          const url = new URL(window.location);
          url.searchParams.delete('id');
          window.history.replaceState({}, '', url);
          return;
        }

        const sorted = features.sort((a, b) => {
          const aStart = extractDate(a, "start_decdate", "start_date");
          const bStart = extractDate(b, "start_decdate", "start_date");
          if (aStart !== bStart) return aStart - bStart;
          const aEnd = extractDate(a, "end_decdate", "end_date");
          const bEnd = extractDate(b, "end_decdate", "end_date");
          return aEnd - bEnd;
        });

        if (sorted.length > 0) updateUrlWithFeatureId(sorted[0]);

        tableDiv.innerHTML = "";
        sorted.forEach((feature, idx) => {
          const card = document.createElement("div");
          card.className = "feature-card";

          const ohmBase = 'https://www.openhistoricalmap.org';
          let html = `<h4>Segment ${idx + 1} : ${feature.sourceLayer || 'unknown'}`;
          if (feature.id !== undefined) {
            const osmType = getOsmType(feature);
            html += ` | <small>Feature ID: <a href="${ohmBase}/${osmType}/${feature.id}" target="_blank">${feature.id}</a></small>`;
          }
          html += `</h4><table>`;

          for (const [key, value] of Object.entries(feature.properties)) {
            let cls = "";
            if (key === "start_date") cls = "highlight-start";
            if (key === "end_date") cls = "highlight-end";
            const displayValue = formatPropertyValue(key, value, feature);
            html += `<tr class="${cls}"><td><strong>${key}</strong></td><td>${displayValue}</td></tr>`;
          }

          html += "</table>";
          card.innerHTML = html;
          tableDiv.appendChild(card);
        });
      }

      function addSourceAndLayers(map, mapInfo) {
        const sourceName = mapInfo.name;

        // Add the main vector source for this map
        map.addSource(sourceName, {
          type: 'vector',
          tiles: mapInfo.tiles,
          minzoom: 0,
          maxzoom: 20
        });

        addedLayerIds[sourceName] = [];

        mapInfo.layers.forEach(layer => {
          const colorKey = `${sourceName}__${layer.name}`;
          const color = fixedLayerColors[colorKey] || fallbackColors[fallbackColorIndex++ % fallbackColors.length];
          const layerBase = `${sourceName}__${layer.name}`;

          // Add fill layer (polygons only)
          const fillId = `${layerBase}__fill`;
          map.addLayer({
            id: fillId,
            type: 'fill',
            source: sourceName,
            'source-layer': layer.name,
            filter: ['==', '$type', 'Polygon'],
            minzoom: layer.minzoom || 0,
            maxzoom: (layer.maxzoom || 20) + 1,
            paint: {
              'fill-color': color,
              'fill-opacity': 0.25,
              'fill-outline-color': color
            },
            layout: { visibility: 'none' }
          });

          // Add line layer (lines only)
          const lineId = `${layerBase}__line`;
          map.addLayer({
            id: lineId,
            type: 'line',
            source: sourceName,
            'source-layer': layer.name,
            filter: ['==', '$type', 'LineString'],
            minzoom: layer.minzoom || 0,
            maxzoom: (layer.maxzoom || 20) + 1,
            paint: {
              'line-color': color,
              'line-width': 2,
              'line-opacity': 0.8
            },
            layout: { visibility: 'none' }
          });

          // Add circle layer (points only)
          const circleId = `${layerBase}__circle`;
          map.addLayer({
            id: circleId,
            type: 'circle',
            source: sourceName,
            'source-layer': layer.name,
            filter: ['==', '$type', 'Point'],
            minzoom: layer.minzoom || 0,
            maxzoom: (layer.maxzoom || 20) + 1,
            paint: {
              'circle-color': color,
              'circle-radius': 5,
              'circle-opacity': 0.7,
              'circle-stroke-color': '#fff',
              'circle-stroke-width': 1
            },
            layout: { visibility: 'none' }
          });

          addedLayerIds[sourceName].push(
            { layerName: layer.name, color: color, ids: [fillId, lineId, circleId] }
          );
        });
      }

      function setLayerVisibility(map, sourceName, layerName, visible) {
        const entry = addedLayerIds[sourceName];
        if (!entry) return;
        const layerEntry = entry.find(e => e.layerName === layerName);
        if (!layerEntry) return;
        layerEntry.ids.forEach(id => {
          map.setLayoutProperty(id, 'visibility', visible ? 'visible' : 'none');
        });
      }

      function setAllLayersVisibility(map, sourceName, visible) {
        const entry = addedLayerIds[sourceName];
        if (!entry) return;
        entry.forEach(layerEntry => {
          layerEntry.ids.forEach(id => {
            map.setLayoutProperty(id, 'visibility', visible ? 'visible' : 'none');
          });
        });
      }

      function buildLayerPanel(map, capabilities) {
        const sourcesList = document.getElementById("sources-list");
        sourcesList.innerHTML = "";

        capabilities.maps.forEach((mapInfo, idx) => {
          const group = document.createElement("div");
          group.className = "map-group";

          // Group header with checkbox to toggle all layers
          const header = document.createElement("div");
          header.className = "map-group-header";

          const groupCheckbox = document.createElement("input");
          groupCheckbox.type = "checkbox";
          groupCheckbox.id = `grp_${mapInfo.name}`;

          const headerLabel = document.createElement("span");
          headerLabel.textContent = `${mapInfo.name} (${mapInfo.layers.length} capas)`;

          const arrow = document.createElement("span");
          arrow.textContent = " \u25B6";
          arrow.style.fontSize = "10px";

          header.appendChild(groupCheckbox);
          header.appendChild(headerLabel);
          header.appendChild(arrow);

          // Layers container
          const layersDiv = document.createElement("div");
          layersDiv.className = "map-group-layers";

          const layerCheckboxes = [];

          // Add the source and layers to the map first so colors are assigned
          addSourceAndLayers(map, mapInfo);

          // Now build checkboxes with per-layer colors
          const layerEntries = addedLayerIds[mapInfo.name] || [];

          mapInfo.layers.forEach((layer, layerIdx) => {
            const layerLabel = document.createElement("label");
            const cb = document.createElement("input");
            cb.type = "checkbox";
            cb.id = `chk_${mapInfo.name}__${layer.name}`;
            cb.addEventListener("change", (e) => {
              setLayerVisibility(map, mapInfo.name, layer.name, e.target.checked);
              // Update group checkbox state
              const allChecked = layerCheckboxes.every(c => c.checked);
              const someChecked = layerCheckboxes.some(c => c.checked);
              groupCheckbox.checked = allChecked;
              groupCheckbox.indeterminate = someChecked && !allChecked;
            });
            layerCheckboxes.push(cb);

            // Per-layer color dot
            const layerDot = document.createElement("span");
            layerDot.className = "color-dot";
            const entry = layerEntries[layerIdx];
            layerDot.style.background = entry ? entry.color : '#888';

            layerLabel.appendChild(cb);
            layerLabel.appendChild(layerDot);
            layerLabel.appendChild(document.createTextNode(` ${layer.name} (z${layer.minzoom}-${layer.maxzoom})`));
            layersDiv.appendChild(layerLabel);
          });

          // Group checkbox toggles all layers
          groupCheckbox.addEventListener("change", (e) => {
            const checked = e.target.checked;
            layerCheckboxes.forEach(cb => {
              cb.checked = checked;
              cb.dispatchEvent(new Event("change"));
            });
            setAllLayersVisibility(map, mapInfo.name, checked);
          });

          // Click header to expand/collapse
          headerLabel.addEventListener("click", (e) => {
            e.stopPropagation();
            const isExpanded = layersDiv.classList.contains("expanded");
            layersDiv.classList.toggle("expanded");
            arrow.textContent = isExpanded ? " \u25B6" : " \u25BC";
          });
          arrow.addEventListener("click", (e) => {
            e.stopPropagation();
            const isExpanded = layersDiv.classList.contains("expanded");
            layersDiv.classList.toggle("expanded");
            arrow.textContent = isExpanded ? " \u25B6" : " \u25BC";
          });

          group.appendChild(header);
          group.appendChild(layersDiv);
          sourcesList.appendChild(group);
        });
      }

      document.addEventListener("DOMContentLoaded", () => {
        const { center, zoom } = getCenterZoomFromHash();

        const envIndicator = document.getElementById("env-indicator");
        envIndicator.textContent = `Env: ${env.toUpperCase()}`;
        envIndicator.style.background = env === 'production' ? 'rgba(220, 38, 38, 0.8)' : 'rgba(34, 197, 94, 0.8)';

        const loadingEl = document.getElementById("loading-indicator");
        loadingEl.style.display = "block";

        // Create map with empty style (no predefined layers)
        const map = new maplibregl.Map({
          container: "map",
          style: {
            version: 8,
            sources: {},
            layers: [
              { id: "background", type: "background", paint: { "background-color": "#1a1a2e" } }
            ]
          },
          center, zoom, hash: true,
        });

        // Toggle layer panel
        const toggleBtn = document.getElementById("layer-toggle");
        const panel = document.getElementById("layer-panel");
        toggleBtn.addEventListener("click", () => {
          panel.style.display = (panel.style.display === "none" || panel.style.display === "") ? "block" : "none";
        });

        map.on("load", () => {
          // Fetch capabilities and build the UI
          fetch(capabilitiesUrl)
            .then(res => res.json())
            .then(capabilities => {
              loadingEl.style.display = "none";
              buildLayerPanel(map, capabilities);
            })
            .catch(err => {
              loadingEl.style.display = "none";
              console.error("Error fetching capabilities:", err);
              document.getElementById("sources-list").innerHTML =
                `<em style="color:#f88">Error cargando fuentes: ${err.message}</em>`;
            });

          // On click, query rendered features and display attributes
          map.on("click", (e) => {
            const boxSize = 5;
            const features = map.queryRenderedFeatures([
              [e.point.x - boxSize, e.point.y - boxSize],
              [e.point.x + boxSize, e.point.y + boxSize]
            ]);

            // Filter out the background layer
            const filtered = features.filter(f => f.layer && f.layer.id !== "background");

            if (!filtered.length) {
              document.getElementById("attribute-table").innerHTML =
                "<em>No hay objetos en este punto.</em>";
              return;
            }

            displayFeatures(filtered);
          });

          // If there's an ID in the URL, search for it
          if (featureId) {
            map.once('idle', () => {
              setTimeout(() => {
                findFeatureById(map, featureId);
              }, 1000);
            });
          }
        });
      });

      function findFeatureById(map, targetId) {
        if (!targetId) return;

        // Enable all layers temporarily
        const allMapLayers = map.getStyle().layers;
        const originalVisibility = {};
        allMapLayers.forEach(layer => {
          if (layer.type !== "background") {
            originalVisibility[layer.id] = map.getLayoutProperty(layer.id, "visibility");
            map.setLayoutProperty(layer.id, "visibility", "visible");
          }
        });

        setTimeout(() => {
          const allFeatures = map.queryRenderedFeatures([
            [0, 0],
            [map.getCanvas().width, map.getCanvas().height]
          ]);

          const matching = allFeatures.filter(f => {
            if (f.id !== undefined) return f.id.toString() === targetId.toString();
            if (f.properties && f.properties.id !== undefined)
              return f.properties.id.toString() === targetId.toString();
            if (f.properties && f.properties.osm_id !== undefined)
              return f.properties.osm_id.toString() === targetId.toString();
            return false;
          });

          // Restore visibility
          allMapLayers.forEach(layer => {
            if (layer.type !== "background") {
              map.setLayoutProperty(layer.id, "visibility", originalVisibility[layer.id] || "none");
            }
          });

          if (matching.length > 0) {
            const f = matching[0];
            // Make only the found feature's layers visible
            if (f.source && f.sourceLayer) {
              setLayerVisibility(map, f.source, f.sourceLayer, true);
              const cb = document.getElementById(`chk_${f.source}__${f.sourceLayer}`);
              if (cb) cb.checked = true;
            }

            let centerCoords = null;
            const targetZoom = 15;
            const geom = f.geometry;

            if (geom.type === "Point" && geom.coordinates) {
              centerCoords = geom.coordinates;
            } else if (geom.coordinates) {
              const allCoords = geom.type === "Polygon" ? geom.coordinates[0]
                : geom.type === "MultiLineString" ? geom.coordinates.flat()
                : geom.coordinates;
              if (Array.isArray(allCoords) && allCoords.length) {
                const lngs = allCoords.map(c => c[0]);
                const lats = allCoords.map(c => c[1]);
                centerCoords = [
                  (Math.min(...lngs) + Math.max(...lngs)) / 2,
                  (Math.min(...lats) + Math.max(...lats)) / 2
                ];
              }
            }

            if (centerCoords) {
              map.flyTo({ center: centerCoords, zoom: Math.max(map.getZoom(), targetZoom) });
              map.once('moveend', () => displayFeatures([f]));
            } else {
              displayFeatures([f]);
            }
          } else {
            document.getElementById("attribute-table").innerHTML =
              `<em>No se encontro objeto con ID: ${targetId}</em>`;
          }
        }, 500);
      }
    </script>
  </body>
</html>
