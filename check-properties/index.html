<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>OpenHistoricalMap - Comparador de propiedades</title>
    <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no" />

    <link href="https://unpkg.com/maplibre-gl@2.4.0/dist/maplibre-gl.css" rel="stylesheet" />
    <script src="https://unpkg.com/maplibre-gl@2.4.0/dist/maplibre-gl.js"></script>

    <style>
      html, body {
        margin: 0; padding: 0; height: 100%; overflow: hidden;
        font-family: sans-serif;
      }
      #map { position: absolute; top: 0; bottom: 0; width: 100%; }

      #layer-toggle {
        position: absolute;
        top: 10px; left: 10px;
        background: #333;
        color: white;
        padding: 6px 10px;
        border-radius: 4px;
        cursor: pointer;
        z-index: 1100;
        font-size: 13px;
      }

      #env-indicator {
        position: absolute;
        top: 10px; right: 10px;
        background: rgba(0,0,0,0.7);
        color: white;
        padding: 6px 10px;
        border-radius: 4px;
        z-index: 1100;
        font-size: 12px;
        font-weight: bold;
      }

      #layer-panel {
        position: absolute;
        top: 45px; left: 10px;
        background: rgba(0,0,0,0.7);
        color: white;
        max-height: 50%;
        overflow-y: auto;
        padding: 10px;
        border-radius: 6px;
        z-index: 1000; font-size: 13px;
        display: none; /* starts hidden */
      }

      #attribute-table {
        position: absolute; bottom: 0; left: 0; right: 0;
        max-height: 70%; background: rgba(255,255,255,0.95);
        overflow-y: auto; border-top: 2px solid #444;
        font-size: 13px; padding: 8px;
        display: flex; flex-wrap: wrap; gap: 10px;
      }
      .feature-card {
        background: white; border: 1px solid #ccc; border-radius: 6px;
        padding: 6px; font-size: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        max-height: 220px; overflow-y: auto; flex: 1 1 250px;
      }
      .feature-card h4 {
        margin: 3px 0; font-size: 13px;
        border-bottom: 1px solid #ddd; padding-bottom: 2px;
      }
      .feature-card table { width: 100%; border-collapse: collapse; }
      .feature-card td {
        border-bottom: 1px solid #eee;
        padding: 2px 4px; word-break: break-word;
      }
      .feature-card tr:last-child td { border-bottom: none; }
      .highlight-start { background: #c6f6c6; font-weight: bold; } /* green */
      .highlight-end { background: #fff6b3; font-weight: bold; }   /* yellow */
    </style>
  </head>
  <body>
    <div id="map"></div>
    <div id="layer-toggle">☰ Capas</div>
    <div id="env-indicator"></div>
    <div id="layer-panel"><strong>Capas</strong><br/></div>
    <div id="attribute-table"><em>Haz click en un objeto para ver sus atributos...</em></div>

    <script>
      // Detect environment from URL parameter (?env=staging) or default production
      const urlParams = new URLSearchParams(window.location.search);
      const env = urlParams.get('env') || 'production';
      const featureId = urlParams.get('id'); // ID of the object to search for
      
      const staging_options = {
        vtiles_style: "https://vtiles.ohmstaging.org/maps/osm/style.json",
      };
      
      const production_options = {
        vtiles_style: "https://vtiles.openhistoricalmap.org/maps/osm/style.json",
      };
      
      const options = env === 'production' ? production_options : staging_options;

      function getCenterZoomFromHash() {
        const hash = window.location.hash;
        let zoom = 10, lat = 49.9521, lng = 8.524;
        const match = hash.match(/#(\d+\.?\d*)\/([-\d.]+)\/([-\d.]+)/);
        if (match) {
          zoom = parseFloat(match[1]);
          lat = parseFloat(match[2]);
          lng = parseFloat(match[3]);
        }
        return { center: [lng, lat], zoom };
      }

      function injectBackgroundLayerIfMissing(map) {
        const hasBackground = map.getStyle().layers.some(l => l.type === "background");
        if (!hasBackground) {
          map.addLayer({ id: "background", type: "background",
            paint: { "background-color": "#000000" } }, 
            map.getStyle().layers[0]?.id);
        }
      }

      function extractDate(feature, keyDec, keyString) {
        if (feature.properties[keyDec] !== undefined) {
          return parseFloat(feature.properties[keyDec]);
        }
        if (feature.properties[keyString] !== undefined) {
          const val = feature.properties[keyString];
          const year = parseInt(val.toString().substring(0,4));
          return isNaN(year) ? Infinity : year;
        }
        return Infinity;
      }

      function updateUrlWithFeatureId(feature) {
        // Get the feature ID (can be in feature.id or in properties)
        let id = null;
        if (feature.id !== undefined) {
          id = feature.id.toString();
        } else if (feature.properties && feature.properties.id !== undefined) {
          id = feature.properties.id.toString();
        } else if (feature.properties && feature.properties.osm_id !== undefined) {
          id = feature.properties.osm_id.toString();
        }
        
        if (!id) return;
        
        // Update URL without reloading the page
        const url = new URL(window.location);
        url.searchParams.set('id', id);
        // Keep the env parameter if it exists
        if (env) {
          url.searchParams.set('env', env);
        }
        window.history.replaceState({}, '', url);
      }

      function displayFeatures(features, map) {
        const tableDiv = document.getElementById("attribute-table");
        
        if (!features.length) {
          tableDiv.innerHTML = "<em>No objects found.</em>";
          // Clear the ID from URL if there are no objects
          const url = new URL(window.location);
          url.searchParams.delete('id');
          window.history.replaceState({}, '', url);
          return;
        }
        
        const sorted = features.sort((a,b) => {
          const aStart = extractDate(a, "start_decdate", "start_date");
          const bStart = extractDate(b, "start_decdate", "start_date");
          if (aStart !== bStart) return aStart - bStart;
          const aEnd = extractDate(a, "end_decdate", "end_date");
          const bEnd = extractDate(b, "end_decdate", "end_date");
          return aEnd - bEnd;
        });

        // Update URL with the ID of the first feature (the most relevant)
        if (sorted.length > 0) {
          updateUrlWithFeatureId(sorted[0]);
        }

        tableDiv.innerHTML = ""; 
        sorted.forEach((feature, idx) => {
          const card = document.createElement("div");
          card.className = "feature-card";

          let html = `<h4> Segment ${idx+1} : ${feature.layer?.id || 'unknown'}`;
          if (feature.id !== undefined) {
            html += ` | <small>Feature ID: ${feature.id}</small>`;
          }
          html += `</h4><table>`;

          for (const [key, value] of Object.entries(feature.properties)) {
            let cls = "";
            if (key === "start_date") cls = "highlight-start";
            if (key === "end_date") cls = "highlight-end";
            html += `<tr class="${cls}"><td><strong>${key}</strong></td><td>${value}</td></tr>`;
          }

          html += "</table>";
          card.innerHTML = html;
          tableDiv.appendChild(card);
        });
      }

      function findFeatureById(map, targetId) {
        if (!targetId) return;
        
        const layers = map.getStyle().layers;
        let foundFeature = null;
        let foundLayer = null;
        
        // First, temporarily activate all layers to enable searching
        const originalVisibility = {};
        layers.forEach(layer => {
          if (layer.type !== "background") {
            originalVisibility[layer.id] = map.getLayoutProperty(layer.id, "visibility");
            map.setLayoutProperty(layer.id, "visibility", "visible");
          }
        });
        
        // Function to search for the feature
        const searchFeature = () => {
          // Search in all rendered features
          const allFeatures = map.queryRenderedFeatures([
            [0, 0],
            [map.getCanvas().width, map.getCanvas().height]
          ]);
          
          // Search for the feature with the corresponding ID
          const matching = allFeatures.filter(f => {
            if (f.id !== undefined) {
              return f.id.toString() === targetId.toString();
            }
            // Also search in properties in case the ID is there
            if (f.properties && f.properties.id !== undefined) {
              return f.properties.id.toString() === targetId.toString();
            }
            if (f.properties && f.properties.osm_id !== undefined) {
              return f.properties.osm_id.toString() === targetId.toString();
            }
            return false;
          });
          
          if (matching.length > 0) {
            foundFeature = matching[0];
            foundLayer = layers.find(l => l.id === foundFeature.layer.id);
            
            // Restore original visibility but keep the found layer visible
            layers.forEach(layer => {
              if (layer.type !== "background") {
                if (layer.id === foundLayer.id) {
                  map.setLayoutProperty(layer.id, "visibility", "visible");
                  const checkbox = document.getElementById("chk_" + layer.id);
                  if (checkbox) checkbox.checked = true;
                } else {
                  map.setLayoutProperty(layer.id, "visibility", originalVisibility[layer.id] || "none");
                  const checkbox = document.getElementById("chk_" + layer.id);
                  if (checkbox) checkbox.checked = originalVisibility[layer.id] === "visible";
                }
              }
            });
            
            // Get the center of the feature to zoom in
            let centerCoords = null;
            let targetZoom = 15;
            
            if (foundFeature.geometry.type === "Point" && foundFeature.geometry.coordinates) {
              centerCoords = foundFeature.geometry.coordinates;
            } else if (foundFeature.geometry.type === "LineString" && foundFeature.geometry.coordinates) {
              const coords = foundFeature.geometry.coordinates;
              const lngs = coords.map(c => c[0]);
              const lats = coords.map(c => c[1]);
              centerCoords = [
                (Math.min(...lngs) + Math.max(...lngs)) / 2,
                (Math.min(...lats) + Math.max(...lats)) / 2
              ];
            } else if (foundFeature.geometry.type === "MultiLineString" && foundFeature.geometry.coordinates) {
              const allCoords = foundFeature.geometry.coordinates.flat();
              const lngs = allCoords.map(c => c[0]);
              const lats = allCoords.map(c => c[1]);
              centerCoords = [
                (Math.min(...lngs) + Math.max(...lngs)) / 2,
                (Math.min(...lats) + Math.max(...lats)) / 2
              ];
            } else if (foundFeature.geometry.type === "Polygon" && foundFeature.geometry.coordinates) {
              const allCoords = foundFeature.geometry.coordinates[0]; // exterior ring
              const lngs = allCoords.map(c => c[0]);
              const lats = allCoords.map(c => c[1]);
              centerCoords = [
                (Math.min(...lngs) + Math.max(...lngs)) / 2,
                (Math.min(...lats) + Math.max(...lats)) / 2
              ];
            }
            
            if (centerCoords) {
              map.flyTo({
                center: centerCoords,
                zoom: Math.max(map.getZoom(), targetZoom)
              });
              map.once('moveend', () => {
                displayFeatures([foundFeature], map);
              });
            } else {
              displayFeatures([foundFeature], map);
            }
          } else {
            // Not found, restore original visibility
            layers.forEach(layer => {
              if (layer.type !== "background") {
                map.setLayoutProperty(layer.id, "visibility", originalVisibility[layer.id] || "none");
                const checkbox = document.getElementById("chk_" + layer.id);
                if (checkbox) checkbox.checked = originalVisibility[layer.id] === "visible";
              }
            });
            
            const tableDiv = document.getElementById("attribute-table");
            tableDiv.innerHTML = `<em>No object found with ID: ${targetId}</em>`;
          }
        };
        
        // Execute the search after activating the layers
        setTimeout(searchFeature, 500);
      }

      document.addEventListener("DOMContentLoaded", () => {
        const { center, zoom } = getCenterZoomFromHash();
        
        // Show environment indicator
        const envIndicator = document.getElementById("env-indicator");
        envIndicator.textContent = `Environment: ${env.toUpperCase()}`;
        envIndicator.style.background = env === 'production' ? 'rgba(220, 38, 38, 0.8)' : 'rgba(34, 197, 94, 0.8)';

        const map = new maplibregl.Map({
          container: "map",
          style: options.vtiles_style,
          center, zoom, hash: true,
        });

        // Toggle layer panel
        const toggleBtn = document.getElementById("layer-toggle");
        const panel = document.getElementById("layer-panel");
        toggleBtn.addEventListener("click", () => {
          panel.style.display = (panel.style.display === "none" || panel.style.display === "") ? "block" : "none";
        });

        map.on("load", () => {
          injectBackgroundLayerIfMissing(map);

          // Build layer list
          const layers = map.getStyle().layers;

          layers.forEach(layer => {
            if(layer.type === "background") return;
            const isDefaultVisible = (layer.id === "land_ohm_lines");
            map.setLayoutProperty(layer.id, "visibility", isDefaultVisible ? "visible" : "none");

            const item = document.createElement("div");
            const checkbox = document.createElement("input");
            checkbox.type = "checkbox";
            checkbox.checked = isDefaultVisible;
            checkbox.id = "chk_" + layer.id;
            checkbox.addEventListener("change", (e) => {
              map.setLayoutProperty(layer.id, "visibility", e.target.checked ? "visible" : "none");
            });
            const label = document.createElement("label");
            label.htmlFor = checkbox.id;
            label.innerText = " " + layer.id;

            item.appendChild(checkbox); item.appendChild(label);
            panel.appendChild(item);
          });

          // On click, sort and display features in cards
          map.on("click", (e) => {
            const boxSize = 5; // tolerance in pixels (5px around the click)
            const features = map.queryRenderedFeatures([
            [e.point.x - boxSize, e.point.y - boxSize],
            [e.point.x + boxSize, e.point.y + boxSize]
            ]);
            
            if (!features.length) {
              const tableDiv = document.getElementById("attribute-table");
              tableDiv.innerHTML = "<em>No objects at this point.</em>";
              return;
            }
            
            displayFeatures(features, map);
          });
          
          // If there's an ID in the URL, search for and display the feature
          if (featureId) {
            // Wait for the map to be completely rendered
            map.once('idle', () => {
              setTimeout(() => {
                findFeatureById(map, featureId);
              }, 1000);
            });
          }
        });
      });
    </script>
  </body>
</html>
